resolver 127.0.0.11 valid=10s ipv6=off;

upstream kodame_api {
    zone kodame_api 64k;
    server kodame-redesign-api:8100 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 140m;
    client_body_timeout 10m;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location = /assets/odaon-v1-live.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }
    # A missing module must never receive index.html with HTTP 200. That hides
    # deployment defects and crashes the entire application at script parse.
    location /assets/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
    location = /api/v2 {
        proxy_pass http://kodame_api/api/v2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v2/ {
        proxy_pass http://kodame_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
