services:
  kodame-redesign-api:
    build:
      context: .
      dockerfile: redesign/backend/Dockerfile
    container_name: kodame-redesign-api
    environment:
      HOST: 0.0.0.0
      PORT: 8100
      DATA_DIR: /app/data
    volumes:
      - ./data-redesign:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  kodame-redesign-web:
    build:
      context: .
      dockerfile: redesign/frontend/Dockerfile
    container_name: kodame-redesign-web
    depends_on:
      kodame-redesign-api:
        condition: service_healthy
    ports:
      - "8002:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
